name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: APK montre (Wear OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        working-directory: wear
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WatchLink-montre-apk
          path: wear/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: IPA iPhone (non signé)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compiler sans signature
        working-directory: ios
        run: |
          xcodebuild \
            -project WatchLink.xcodeproj \
            -scheme WatchLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Fabriquer l'IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WatchLink.app Payload/
          zip -r WatchLink.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WatchLink-iphone-ipa
          path: ios/WatchLink.ipa

  release:
    name: Publier la release
    needs: [android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'MARKETING_VERSION: "[^"]*"' ios/project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp dist/WatchLink-montre-apk/app-debug.apk "WatchLink-montre-$VERSION.apk"
          cp dist/WatchLink-iphone-ipa/WatchLink.ipa "WatchLink-iphone-$VERSION.ipa"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "WatchLink-montre-$VERSION.apk" "WatchLink-iphone-$VERSION.ipa" --clobber
          else
            gh release create "v$VERSION" "WatchLink-montre-$VERSION.apk" "WatchLink-iphone-$VERSION.ipa" \
              --target "$GITHUB_SHA" \
              --title "WatchLink $VERSION" \
              --notes "APK pour la montre (Wear OS) et IPA non signé pour l'iPhone (à installer avec SideStore)."
          fi
